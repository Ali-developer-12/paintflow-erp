name: macOS build

on:
  workflow_dispatch:
  push:
    branches:
      - gsn-mac
    paths-ignore:
      - "docs/**"
      - "*.md"

concurrency:
  group: gsn-mac-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package-mac:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      MAC_ARCH: ${{ matrix.arch }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out gsn-mac
        uses: actions/checkout@v7

      - name: Prepare log directory
        run: mkdir -p build-logs

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: |
          set -euo pipefail
          mkdir -p build-logs
          npm ci 2>&1 | tee build-logs/npm-root.log
          npm --prefix server ci 2>&1 | tee build-logs/npm-server.log

      - name: Run server tests
        run: |
          set -euo pipefail
          mkdir -p build-logs
          npm test --prefix server 2>&1 | tee build-logs/server-tests.log

      - name: Build the application
        run: |
          set -euo pipefail
          mkdir -p build-logs
          npm run build 2>&1 | tee build-logs/app-build.log

      - name: Install the Electron SQLite binary for this Mac
        env:
          npm_config_arch: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p build-logs
          npm run native:electron --prefix server 2>&1 | tee build-logs/electron-native.log

      - name: Package DMG and ZIP for this Mac
        env:
          GSN_CSC_LINK: ${{ secrets.CSC_LINK }}
          GSN_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          GSN_APPLE_ID: ${{ secrets.APPLE_ID }}
          GSN_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          GSN_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          mkdir -p build-logs
          if [[ -n "${GSN_CSC_LINK:-}" ]]; then
            export CSC_LINK="$GSN_CSC_LINK"
            if [[ -n "${GSN_CSC_KEY_PASSWORD:-}" ]]; then
              export CSC_KEY_PASSWORD="$GSN_CSC_KEY_PASSWORD"
            fi
            if [[ -n "${GSN_APPLE_ID:-}" ]]; then
              export APPLE_ID="$GSN_APPLE_ID"
            fi
            if [[ -n "${GSN_APPLE_APP_SPECIFIC_PASSWORD:-}" ]]; then
              export APPLE_APP_SPECIFIC_PASSWORD="$GSN_APPLE_APP_SPECIFIC_PASSWORD"
            fi
            if [[ -n "${GSN_APPLE_TEAM_ID:-}" ]]; then
              export APPLE_TEAM_ID="$GSN_APPLE_TEAM_ID"
            fi
          fi
          npx electron-builder --mac dmg zip --${MAC_ARCH} --publish never 2>&1 | tee build-logs/electron-builder.log
          APP_PATH="release/mac${MAC_ARCH/arm64/-arm64}/GSN Paints.app"
          if [[ "$MAC_ARCH" == "x64" ]]; then
            APP_PATH="release/mac/GSN Paints.app"
          fi
          test -d "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Verify app, native architecture, signatures, DMG, and ZIP
        run: |
          set -euo pipefail
          mkdir -p build-logs
          VERSION="$(node -p "require('./package.json').version")"
          APP_PATH="release/mac${MAC_ARCH/arm64/-arm64}/GSN Paints.app"
          if [[ "$MAC_ARCH" == "x64" ]]; then
            APP_PATH="release/mac/GSN Paints.app"
          fi
          DMG_PATH="release/GSN-Paints-${VERSION}-mac-${MAC_ARCH}.dmg"
          ZIP_PATH="release/GSN-Paints-${VERSION}-mac-${MAC_ARCH}.zip"
          test -d "$APP_PATH"
          test -f "$DMG_PATH"
          test -f "$ZIP_PATH"
          bash scripts/verify-macos-package.sh "$MAC_ARCH" "$APP_PATH" "$DMG_PATH" "$ZIP_PATH" 2>&1 | tee build-logs/package-verification.log

      - name: Smoke test the installed app
        run: |
          set -euo pipefail
          mkdir -p build-logs
          node scripts/smoke-packaged.mjs --app "$APP_PATH" 2>&1 | tee build-logs/packaged-smoke.log

      - name: Create artifact checksums
        run: |
          set -euo pipefail
          mkdir -p build-logs
          find release -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' \) -print0 \
            | sort -z \
            | xargs -0 shasum -a 256 > release/SHA256SUMS.txt
          cat release/SHA256SUMS.txt

      - name: Upload installers and build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gsn-paints-macos-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/SHA256SUMS.txt
            build-logs/**
          if-no-files-found: error
          retention-days: 7

appId: com.gsnpaints.erp
productName: GSN Paints
artifactName: GSN-Paints-${version}-mac-${arch}.${ext}

files:
  - electron/**
  - server/electron-runtime/node_modules/**
  - package.json
  - "!**/*.map"
  - "!**/.git/**"
  - "!**/.env*"
  - "!**/.output/**"
  - "!**/docs/**"
  - "!**/scripts/**"
  - "!**/test-results/**"
  - "!**/playwright-report/**"
  - "!**/*.db"
  - "!**/*.db-*"
  - "!**/*.log"
  - "!server/node_modules/better-sqlite3/**"
  - "!server/node_modules/.bin/**"

includeSubNodeModules: true

extraResources:
  - from: dist
    to: dist
    filter:
      - "**/*"
  - from: server/src
    to: server/src
    filter:
      - "**/*"
      - "!**/*.test.js"
      - "!run-electron-tests.js"
      - "!install-electron-native.js"
      - "!test-compat.js"
      - "!test-runner.js"
      - "!test-runtime.js"
  - from: server/package.json
    to: server/package.json
  - from: server/node_modules
    to: server/node_modules
    filter:
      - "**/*"
      - "!better-sqlite3/**"
      - "!.bin/**"

asarUnpack:
  - server/electron-runtime/node_modules/better-sqlite3/build/Release/*.node

mac:
  category: public.app-category.business
  icon: build/icon.png
  target:
    - dmg
    - zip
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  minimumSystemVersion: "10.13"

afterSign: scripts/after-sign-macos.cjs

dmg:
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

directories:
  output: release

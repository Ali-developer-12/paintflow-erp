appId: com.gsnpaints.erp
productName: GSN Paints
artifactName: GSN-Paints-${version}-mac-${arch}.${ext}

files:
  - dist/**
  - electron/**
  - server/src/**
  - server/package.json
  - server/node_modules/**
  - server/electron-runtime/node_modules/**
  - package.json
  - "!server/src/**/*.test.js"
  - "!server/src/run-electron-tests.js"
  - "!server/src/install-electron-native.js"
  - "!server/src/test-compat.js"
  - "!server/src/test-runner.js"
  - "!server/src/test-runtime.js"
  - "!**/*.map"
  - "!**/.git/**"
  - "!**/.env*"
  - "!**/.output/**"
  - "!**/docs/**"
  - "!**/scripts/**"
  - "!**/test-results/**"
  - "!**/playwright-report/**"
  - "!**/*.db"
  - "!**/*.db-*"
  - "!**/*.log"
  - "!server/node_modules/better-sqlite3/**"
  - "!server/node_modules/.bin/**"

includeSubNodeModules: true

asarUnpack:
  - server/electron-runtime/node_modules/better-sqlite3/build/Release/*.node

mac:
  category: public.app-category.business
  icon: build/icon.png
  target:
    - dmg
    - zip
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  minimumSystemVersion: "10.13"

afterSign: scripts/after-sign-macos.cjs

dmg:
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

directories:
  output: release
